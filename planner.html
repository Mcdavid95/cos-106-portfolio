<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Academic planner - add, complete and delete study tasks">
  <title>Planner | Mcdavid Emereuwa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <nav class="nav container" aria-label="Main navigation">
      <a href="index.html" class="logo">Mcdavid<span>.</span></a>
      <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false">&#9776;</button>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="planner.html" aria-current="page">Planner</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <h1 class="section-title">Academic planner</h1>
    <p class="page-intro">
      Keep track of assignments, readings and exams. Tasks are saved in your browser, so they're
      still here when you come back.
    </p>

    <section class="planner">
      <form id="taskForm" class="card task-form" novalidate>
        <h2>Add a task</h2>
        <div class="field">
          <label for="taskTitle">Task</label>
          <input type="text" id="taskTitle" placeholder="e.g. Read COS 106 module 3">
          <small class="error" id="taskError"></small>
        </div>
        <div class="field">
          <label for="taskCourse">Course</label>
          <select id="taskCourse">
            <option value="COS 106">COS 106</option>
            <option value="General">General</option>
            <option value="Personal">Personal</option>
          </select>
        </div>
        <div class="field">
          <label for="taskDue">Due date</label>
          <input type="date" id="taskDue">
        </div>
        <button type="submit" class="btn btn-accent">Add task</button>
      </form>

      <div class="card">
        <div class="planner-head">
          <h2 id="taskCount">0 tasks</h2>
          <div class="filters">
            <button type="button" class="active" data-filter="all">All</button>
            <button type="button" data-filter="active">Active</button>
            <button type="button" data-filter="done">Done</button>
          </div>
        </div>
        <ul id="taskList" class="task-list"></ul>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; <span id="year"></span> Mcdavid Emereuwa &middot; COS 106 Term Project &middot;
      <a href="https://github.com/Mcdavid95" target="_blank" rel="noopener">GitHub</a></p>
  </footer>

  <script src="js/main.js"></script>
  <script src="js/planner.js"></script>
</body>
</html>
